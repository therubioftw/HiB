<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom objects in Bob: prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Slab:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#780d3a; --maroon-2:#5e0a2d; --pink:#d01d73; --pink-soft:#fbe8f1; --pink-line:#f2c2d8;
    --ink:#23191d; --ink-2:#4a3f44; --muted:#7a6f74; --line:#e6e0e3; --bg:#f6f4f5; --card:#fff;
    --ok:#1f8a5b; --ok-soft:#e5f5ed; --warn:#b86e00; --warn-soft:#fdf1dc; --bad:#c0392b; --bad-soft:#fbe6e3;
    --sans:"Montserrat","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --serif:"Roboto Slab",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--pink)}

  /* ---------- chrome ---------- */
  .top{position:fixed;top:0;left:0;right:0;height:52px;background:var(--maroon);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:30}
  .top .grid{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;opacity:.9}
  .top .grid i{background:#fff;border-radius:1px}
  .top .logo{background:#fff;color:var(--maroon);font-weight:700;font-size:13px;border-radius:6px;padding:3px 8px}
  .top .where{color:#fff;font-weight:500;font-size:15px}
  .top .search{flex:0 1 380px;margin:0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);border-radius:18px;
    color:rgba(255,255,255,.85);padding:6px 14px;font-size:13px}
  .top .cmpbtn{background:none;border:0;color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px}
  .top .cmpbtn:hover,.top .cmpbtn.on{background:rgba(255,255,255,.14)}
  .top .me{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--maroon);font-weight:700;font-size:12px;display:grid;place-items:center}
  .rail{position:fixed;top:52px;bottom:0;left:0;width:60px;background:var(--maroon);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px;z-index:20}
  .rail button{width:44px;height:40px;border:0;border-radius:8px;background:none;display:grid;place-items:center}
  .rail button.on{background:rgba(255,255,255,.16)}
  .rail svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7}
  .proto-tag{position:fixed;top:60px;right:16px;z-index:25;font-size:11px;font-weight:600;color:var(--maroon);background:#fff;
    border:1px solid var(--pink-line);border-radius:12px;padding:3px 10px}
  .proto-tag a{color:var(--maroon)}
  main{margin:52px 0 0 60px;padding:26px 32px 230px;min-height:calc(100vh - 52px)}

  /* ---------- settings layout ---------- */
  h1.pg{font:600 24px var(--serif);margin:0 0 18px;color:var(--ink-2)}
  .set{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .snav{font-size:13.5px}
  .snav .g{padding:7px 10px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center}
  .snav .g::before{content:"›";color:var(--muted);width:10px}
  .snav .g.open::before{content:"⌄";position:relative;top:-3px}
  .snav .i{padding:8px 10px 8px 30px;border-radius:6px;color:var(--ink-2);cursor:pointer}
  .snav .i:hover{background:#ece8ea}
  .snav .i.on{background:#e8e2e5;font-weight:600;color:var(--ink)}
  .new{font-size:10px;font-weight:700;color:#fff;background:var(--pink);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .card .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .card .hd h2{font:600 19px var(--serif);margin:0;color:var(--ink-2)}
  .card .bd{padding:20px 22px}
  .sub{color:var(--muted);font-size:13px}
  .btn{border:1px solid transparent;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
  .btn.pri{background:var(--pink);color:#fff}
  .btn.pri:hover{background:#b8165f}
  .btn.out{background:#fff;border-color:#cfc6ca;color:var(--ink)}
  .btn.out:hover{border-color:var(--ink-2)}
  .btn.ghost{background:none;color:var(--pink);padding-left:4px;padding-right:4px}
  .btn[disabled]{opacity:.45;cursor:default}
  .ai{color:var(--pink)}
  .spark::before{content:"✦";margin-right:2px}

  /* empty state */
  .empty{text-align:center;padding:46px 20px 40px}
  .empty .ill{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;font-size:34px;color:var(--pink)}
  .empty h3{margin:0 0 6px;font-size:17px}
  .empty p{margin:0 auto 20px;max-width:460px;color:var(--muted)}
  .empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .objrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
  .objrow .ic{width:40px;height:40px;border-radius:8px;background:var(--pink-soft);display:grid;place-items:center;color:var(--pink);font-size:18px}
  .objrow b{font-size:15px}

  /* wizard */
  .wz-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px}
  .wz-tabs button{border:0;background:none;padding:13px 12px 11px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
  .wz-tabs button .n{width:20px;height:20px;border-radius:50%;background:#eee6ea;color:var(--ink-2);font-size:11px;display:grid;place-items:center}
  .wz-tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}
  .wz-tabs button.on .n{background:var(--pink);color:#fff}
  .wz-tabs button.done .n{background:var(--ok);color:#fff}
  .wz-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fcfbfb;border-radius:0 0 10px 10px}
  .draftnote{display:flex;gap:10px;align-items:flex-start;background:var(--pink-soft);border:1px solid var(--pink-line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px}
  .draftnote b{color:var(--maroon)}
  .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
  .inp{border:1px solid #d6cdd1;border-radius:6px;padding:8px 10px;background:#fff;width:100%}
  .inp:focus{outline:2px solid var(--pink-line);border-color:var(--pink)}
  .row2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:18px}
  .rel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#faf8f9;border:1px dashed #d8cfd3;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-weight:600;font-size:12.5px}
  .chip.pk{background:var(--pink-soft);border-color:var(--pink-line);color:var(--maroon)}
  table.ft{width:100%;border-collapse:collapse;font-size:13px}
  table.ft th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
  table.ft td{padding:7px 8px;border-bottom:1px solid #f0ecee;vertical-align:middle}
  table.ft .inp{padding:6px 8px}
  table.ft select.inp{padding:6px 6px}
  .why{font-size:12px;color:var(--muted)}
  .why.ai{color:#9c1a5a}
  .x{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px;border-radius:4px}
  .x:hover{background:#f1ecee;color:var(--ink)}
  .wfcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:20px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}
  .wfcard .ic{width:34px;height:34px;border-radius:8px;background:#eef6f2;color:var(--ok);display:grid;place-items:center;font-size:16px}
  .tog{position:relative;width:36px;height:20px;border-radius:10px;background:#cfc6ca;border:0;padding:0}
  .tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .tog.on{background:var(--pink)} .tog.on::after{left:18px}

  /* existing data */
  .found{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 18px}
  .found .f{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
  .found .f .p{font-size:12px;color:var(--muted)}
  .found .f b{display:block;margin:2px 0 6px}
  .found .f .c{font-size:12.5px;color:var(--ink-2)}
  .st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 9px;white-space:nowrap}
  .st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
  .st.grey{background:#eee8eb;color:var(--ink-2)}
  .arrow{color:var(--muted);text-align:center}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .opt{display:flex;gap:10px;align-items:center}

  /* access */
  .why-box{border:1px solid var(--pink-line);background:var(--pink-soft);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px}
  .why-box b{color:var(--maroon)}
  table.acc{width:100%;border-collapse:collapse;font-size:13px}
  table.acc th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
  table.acc td{padding:9px 8px;border-bottom:1px solid #f0ecee}
  .yes{color:var(--ok);font-weight:700} .no{color:#b9b0b4}
  .aud{margin-top:14px;font-size:13.5px;background:#faf8f9;border-radius:8px;padding:10px 14px}
  .whr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
  .whr .w{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
  .whr .w b{display:block}
  .h4{font-size:14px;font-weight:700;margin:24px 0 8px}

  /* profile */
  .phead{display:flex;gap:18px;align-items:center;padding:22px}
  .av{width:64px;height:64px;border-radius:50%;background:#e9dde3;color:var(--maroon);font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
  .av.s{width:30px;height:30px;font-size:11px}
  .phead h2{font:600 24px var(--serif);margin:0}
  .pbody{display:grid;grid-template-columns:210px 1fr;gap:22px;margin-top:18px}
  .psec{font-size:13.5px}
  .psec div{padding:7px 10px;color:var(--ink-2);border-radius:6px}
  .psec div.on{background:#e8e2e5;font-weight:600;color:var(--ink)}
  table.rec{width:100%;border-collapse:collapse;font-size:13px}
  table.rec th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
  table.rec td{padding:10px 8px;border-bottom:1px solid #f0ecee}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;font-size:13px}
  .kv span{display:block;color:var(--muted);font-size:12px}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;
    font-size:13.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
  .toast .okc{color:#7fe0b2;font-weight:700}
  .filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  /* companion panel */
  .cmp{position:fixed;right:16px;bottom:16px;width:400px;max-height:calc(100vh - 90px);background:#fff;border-radius:12px;
    box-shadow:0 10px 40px rgba(40,10,25,.25);display:flex;flex-direction:column;z-index:40;border:1px solid var(--line)}
  .cmp .ch{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
  .cmp .ch .beta{font-size:11px;border:1px solid #d6cdd1;border-radius:4px;padding:0 5px;color:var(--muted);font-weight:500}
  .cmp .cb{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:220px}
  .cmp .cf{padding:10px 12px;border-top:1px solid var(--line)}
  .cmp .cf .box{display:flex;gap:8px;align-items:flex-end;border:1px solid #d6cdd1;border-radius:8px;padding:8px}
  .cmp .cf textarea{flex:1;border:0;resize:none;outline:0;min-height:40px;font-size:13.5px}
  .cmp .send{width:30px;height:30px;border-radius:6px;border:0;background:var(--pink);color:#fff;font-size:14px}
  .cmp .disc{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
  .msg{max-width:92%;font-size:13.5px}
  .msg.me{align-self:flex-end;background:#f3eff1;border-radius:10px 10px 2px 10px;padding:9px 12px}
  .msg.bot{align-self:flex-start}
  .msg.bot .who{font-size:12px;font-weight:700;color:var(--pink);margin-bottom:4px}
  .msg.bot ul{margin:6px 0;padding-left:18px}
  .sug{display:flex;flex-direction:column;gap:6px}
  .sug button{text-align:left;background:#fff;border:1px solid #dcd3d7;border-radius:8px;padding:8px 10px;font-size:13px}
  .sug button:hover{border-color:var(--pink);color:var(--maroon)}
  .think{font-size:12.5px;color:var(--muted)}
  .think div{padding:2px 0}
  .think div.done::before{content:"✓ ";color:var(--ok);font-weight:700}
  .think div.run::before{content:"… ";color:var(--pink)}

  /* behind the scenes: the model being built */
  .btsbtn{border:1px solid #cfc6ca;background:#fff;color:var(--ink);border-radius:16px;padding:5px 12px;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
  .btsbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btsbtn code{font:600 12px ui-monospace,Consolas,monospace}
  .bts{position:fixed;top:52px;right:0;bottom:0;width:430px;background:#1e1519;color:#efe7eb;z-index:35;display:flex;flex-direction:column;
    box-shadow:-10px 0 30px rgba(0,0,0,.2)}
  .bts .bh{padding:16px 18px 12px;border-bottom:1px solid #3a2e33;display:flex;gap:10px;align-items:flex-start}
  .bts .bh b{font-size:15px}
  .bts .bh .sub{color:#b9aab1;font-size:12.5px;margin-top:2px}
  .bts .bh .x{color:#b9aab1;margin-left:auto} .bts .bh .x:hover{background:#3a2e33;color:#fff}
  .bts .bb{padding:14px 18px 18px;overflow:auto;flex:1}
  .bts pre{font:12.5px/1.6 ui-monospace,Consolas,"Courier New",monospace;background:#2a1f24;border-radius:8px;padding:12px 14px;margin:0;white-space:pre-wrap;color:#efe7eb}
  .bts pre .k{color:#f3a7cb} .bts pre .c{color:#8f8087} .bts pre .v{color:#a8e0c4}
  .bts .sec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#f3a7cb;font-weight:700;margin:18px 0 8px}
  .bts .rd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bts .rd div{border:1px solid #3a2e33;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
  .bts .rd div span{display:block;font-weight:400;color:#b9aab1;font-size:11.5px}
  .bts .rd div.later{border-style:dashed;color:#b9aab1}
  .bts .fn{font-size:11.5px;color:#8f8087;margin-top:14px}
  body.bts-open main{padding-right:462px}
  body.bts-open .set,body.bts-open .pbody{grid-template-columns:1fr} body.bts-open .snav,body.bts-open .psec{display:none}
  body.bts-open .cmp{right:446px}

  /* guide */
  .guide{position:fixed;left:76px;bottom:16px;width:360px;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px 12px;z-index:45;
    box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .guide .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#f3a7cb;font-weight:700}
  .guide .t{font-size:15px;font-weight:600;margin:3px 0 4px}
  .guide .d{font-size:12.5px;color:#d9d0d4;line-height:1.45}
  .guide .dots{display:flex;gap:5px;margin:10px 0 8px}
  .guide .dots i{height:4px;flex:1;border-radius:2px;background:#5a4d53}
  .guide .dots i.on{background:#f3a7cb}
  .guide .nav{display:flex;justify-content:space-between;align-items:center}
  .guide .nav button{background:none;border:0;color:#fff;font-weight:600;padding:6px 8px;border-radius:6px}
  .guide .nav button:hover{background:rgba(255,255,255,.1)}
  .guide .nav .nx{background:var(--pink)} .guide .nav .nx:hover{background:#b8165f}
  .guide .min{position:absolute;top:8px;right:10px;background:none;border:0;color:#bfb3b8;font-size:14px}
  .guide.mini{width:auto;padding:8px 14px;cursor:pointer}
  .guide.mini > *:not(.k){display:none}
  .pulse{animation:pulse 1.6s ease-in-out 2}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,29,115,0)}50%{box-shadow:0 0 0 6px rgba(208,29,115,.25)}}

  /* intro */
  .veil{position:fixed;inset:0;background:rgba(35,20,27,.55);z-index:80;display:grid;place-items:center;padding:20px}
  .intro{background:#fff;border-radius:14px;max-width:560px;padding:28px 30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .intro .k{font-size:12px;font-weight:700;color:var(--pink);letter-spacing:.05em;text-transform:uppercase}
  .intro h2{font:600 24px var(--serif);margin:6px 0 10px}
  .intro ol{padding-left:20px;margin:12px 0 16px;color:var(--ink-2)}
  .intro ol li{margin:3px 0}
  .intro .fine{font-size:12.5px;color:var(--muted);margin-bottom:18px}

  @media (max-width:900px){
    .set,.pbody{grid-template-columns:1fr} .snav,.psec{display:none}
    .found,.whr{grid-template-columns:1fr 1fr} .row2{grid-template-columns:1fr}
    .rail{display:none}
    .set > *,.pbody > *{min-width:0}
    main{margin-left:0;padding:48px 12px 220px}
    .top{gap:10px;padding:0 12px} .top .search,.top #where{display:none} .top .cmpbtn{margin-left:auto}
    .proto-tag{left:12px;right:12px;text-align:center}
    .card .bd{overflow-x:auto}
    table.ft,table.rec,table.acc{min-width:620px}
    .wz-tabs{overflow-x:auto;padding:0 10px} .wz-tabs button{white-space:nowrap}
    .wz-foot{flex-wrap:wrap} .wz-foot .sub{order:3;width:100%}
    .objrow{grid-template-columns:40px 1fr} .objrow .btn{grid-column:1 / -1;justify-self:start}
    .cmp{left:10px;right:10px;width:auto;bottom:10px;max-height:calc(100vh - 70px)}
    .guide{left:10px;right:10px;width:auto;bottom:10px}
    body.cmp-open .guide{display:none}
    .bts{width:auto;left:0;top:52px} body.bts-open main{padding-right:12px} body.bts-open .guide{display:none} body.bts-open .cmp{right:10px;z-index:50}
    .intro{padding:22px 20px 20px} .intro h2{font-size:21px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <span class="logo">Bob</span>
  <span class="where" id="where">System Settings</span>
  <div class="search">Search for people or areas in Bob</div>
  <button class="cmpbtn" id="cmpbtn"><span class="spark"></span>Companion</button>
  <div class="me" title="Noa Katz, HR systems admin">NK</div>
</header>
<nav class="rail" id="rail"></nav>
<div class="proto-tag">Prototype · made-up data · <a href="../present.html?read">back to the deck</a></div>
<main id="main"></main>
<div id="cmp"></div>
<div id="guide"></div>
<div id="bts"></div>
<div id="toast"></div>
<div id="veil"></div>

<script>
/* ============================================================
   Data (all made up)
   ============================================================ */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return d; };
const fmt = d => d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const daysTo = d => Math.round((d - TODAY)/864e5);

const DRAFT_FIELDS = [

function statusOf(exp){
  if(!exp) return '<span class="st warn">Needs a look</span>';
  const d = daysTo(exp);
  if(d<0) return '<span class="st bad">Expired</span>';
  if(d<=30) return `<span class="st warn">Expires in ${d} days</span>`;
  return '<span class="st ok">Valid</span>';
}

   Behind the scenes: the object definition every product reads
   ============================================================ */
const slug = s => (s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'untitled';
const btsBtn = () => `<button class="btsbtn ${S.bts?'on':''}" data-act="bts" title="See the model behind the screen"><code>&lt;/&gt;</code> Behind the scenes</button>`;
function renderBts(){
  document.body.classList.toggle('bts-open', S.bts);
  if(!S.bts){ $('#bts').innerHTML=''; return; }
  const n = S.name || 'Untitled object', k = t=>`<span class="k">${t}</span>`, c = t=>`<span class="c">${t}</span>`, v = t=>`<span class="v">${esc(t)}</span>`;
  const w = Math.max(10, ...S.fields.map(f=>slug(f.name).length)) + 2;
  const fields = S.fields.length ? S.fields.map(f=>`  ${v(slug(f.name).padEnd(w))}${esc(f.type.toLowerCase().padEnd(12))}${f.req?'required ':''}${f.rule?c('# '+esc(f.rule)):''}`).join('\n') : `  ${c('# no fields yet')}`;
  const hasExpiry = S.fields.some(f=>/expir/i.test(f.name) && f.type==='Date');
  const hasFile = S.fields.some(f=>f.type==='Document');
  const def = [
    `${k('object_type:')} ${v(slug(n))}`,
    `${k('label:')}       ${esc(n)}`,
    `${k('description:')} ${S.desc?esc(S.desc):c('# none yet: the AI reads this')}`,
    `${k('links:')}       person ${c('# many per person')}`,
    `${k('history:')}     every record`,
    `${k('fields:')}`, fields,
    `${k('access:')}`,
    `  records:  inherit ${c('# Professional Summary: uniform, not sensitive')}`,
    hasFile ? `  ${v(slug(S.fields.find(f=>f.type==='Document').name))}: private ${c('# HR admins, HR team, the person')}` : '',
    (S.reminder && hasExpiry) ? `${k('events:')}\n  ${v('expiry_date')} - 30 days -> notify manager, person` : '',
    S.move && S.path==='ai' ? `${k('migrate_from:')}\n  work.certifications, professional_summary.certificates,\n  skills.training_certificates ${c('# '+MOVED+' values; archive after')}` : ''
  ].filter(Boolean).join('\n');
  $('#bts').innerHTML = `<aside class="bts"><div class="bh"><div><b>Behind the scenes</b><div class="sub">The definition of ${esc(n)}, as every Bob product will read it. It updates as you edit.</div></div>
      <button class="x" data-act="bts" aria-label="Close">×</button></div>
    <div class="bb"><pre>${def}</pre>
      <div class="sec">Read by</div>
      <div class="rd"><div>Profiles<span>a section per object</span></div><div>Reports<span>every field and link</span></div>
        <div>Import<span>bulk, from a spreadsheet</span></div><div>Companion<span>types, links, descriptions</span></div>
        <div class="later">Workflows<span>phase 4 (the reminder)</span></div><div class="later">Public API<span>phase 4</span></div></div>
      <div class="sec">Why this matters</div>
      <div style="font-size:12.5px;color:#d9ccd2;line-height:1.5">Every product reads the same definition, so nothing needs to be set up twice. The AI understands the data through it: the types, the link to people, and the descriptions.</div>
      <div class="fn">An illustration of the model, not a real file format.</div></div></aside>`;
}

/* ============================================================
   Companion
   ============================================================ */
function renderCmp(){
  $('#cmpbtn').classList.toggle('on', S.cmp);
  document.body.classList.toggle('cmp-open', S.cmp);
  if(!S.cmp){ $('#cmp').innerHTML=''; return; }
  const msgs = S.chat.map(m=> m.me ? `<div class="msg me">${esc(m.text)}</div>` :
    `<div class="msg bot"><div class="who">✦ Companion</div>${m.html}</div>`).join('');
  const think = S.thinking ? `<div class="msg bot"><div class="who">✦ Companion</div><div class="think">${S.thinking.map(t=>`<div class="${t.s}">${t.t}</div>`).join('')}</div></div>` : '';
  const sug = S.chat.length ? '' : `<div class="msg bot"><div class="who">✦ Companion</div>Hi Noa. Describe the data you need to keep track of, and I'll draft a structure for you to review.</div>
    <div class="sug">${suggestions().map(s=>`<button data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  $('#cmp').innerHTML = `<div class="cmp"><div class="ch"><span class="ai">✦</span> Bob Companion <span class="beta">Beta</span><button class="x" style="margin-left:auto" data-act="closecmp">×</button></div>
    <div class="cb" id="cb">${sug}${msgs}${think}</div>
    <div class="cf"><div class="box"><textarea id="say" placeholder="Ask a question or describe what you need"></textarea><button class="send" data-act="send" aria-label="Send">➤</button></div>
      <div class="disc">Prototype: Companion's answers here are scripted.</div></div></div>`;
  const cb = $('#cb'); cb.scrollTop = cb.scrollHeight;
}
function suggestions(){
  return S.created ? ['Whose certifications expire in the next 30 days?'] : ['Track certifications with an expiry date. Remind the manager 30 days before.'];
}
function openDescribe(){ S.cmp = true; if(S.view==='use') S.view='objects'; render(); setTimeout(()=>{ const t=$('#say'); if(t && !S.chat.length){ t.value=suggestions()[0]; t.focus(); } },30); }

function say(text){
  text = text.trim(); if(!text) return;
  S.chat.push({me:true,text});
  if(S.created && /expir|renew|this month|due/i.test(text)) return answerExpiring();
  if(!S.created && /cert|licen|qualif|training/i.test(text)) return draftFlow();
  S.chat.push({html: S.created
    ? `In this prototype I can answer one question about the new object. Try: <div class="sug" style="margin-top:6px"><button data-say="Whose certifications expire in the next 30 days?">Whose certifications expire in the next 30 days?</button></div>`
    : `In this prototype I can only draft certifications. Try: <div class="sug" style="margin-top:6px"><button data-say="${esc(suggestions()[0])}">${esc(suggestions()[0])}</button></div>`});
  renderCmp();
}
function draftFlow(){
  const steps = ['Reading how your people data is set up','Looking for fields that already hold similar data','Drafting a structure, access and a reminder'];
  S.thinking = steps.map((t,i)=>({t, s:i===0?'run':''})); renderCmp();
  let i = 0;
  const tick = setInterval(()=>{
    S.thinking[i].s='done'; i++;
    if(i<steps.length){ S.thinking[i].s='run'; renderCmp(); return; }
    clearInterval(tick); S.thinking=null; ensureDraft();
    S.chat.push({html:`Here's a draft. <b>Nothing is created until you approve it.</b>
      <ul><li>A <b>Certification</b> object, linked to people (many per person)</li>
      <li>6 fields, with rules like <i>expiry after issue date</i></li>
      <li>A reminder 30 days before expiry, to the manager and the person</li>
      <li>I found <b>3 fields</b> that already hold certification data, and can move it</li></ul>
      <button class="btn pri" data-act="opendraft" style="margin-top:4px">Open the draft</button>`});
    renderCmp(); if(S.step===1) setStep(2,false);
  }, 750);
}
function answerExpiring(){
  const rows = RECORDS.filter(r=>r.d>=0 && r.d<=30).sort((a,b)=>a.d-b.d);
  S.chat.push({html:`${rows.length} certifications expire in the next 30 days:
    <ul>${rows.map(r=>`<li><b>${r.who}</b>, ${r.cert}, ${fmt(addDays(r.d))} (manager: ${r.mgr})</li>`).join('')}</ul>
    Tom Becker's Food hygiene certificate already expired ${-RECORDS.find(r=>r.d<0).d} days ago.
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn pri" data-act="remind">Remind their managers</button><button class="btn out" data-use="report">Open as a report</button></div>`});
  renderCmp();
}

/* ============================================================
   Actions
   ============================================================ */
function ensureDraft(){
  if(S.path) return;
  S.path='ai'; S.name='Certification'; S.desc='A certification or licence someone holds, with its dates and file';
  S.fields = DRAFT_FIELDS.map(f=>({...f}));
}
function startManual(){
  S.path='manual'; S.name=''; S.desc=''; S.fields=[]; S.reminder=false; S.view='wizard'; S.tab='structure'; S.cmp=false; render();
}
function create(silent){
  if(!S.name) S.name='Certification';
  S.created = true; S.view='use'; S.useView='profile';
  if(!silent) toast(`<span class="okc">✓</span> ${esc(S.name)} created. ${S.move?`${MOVED} values moved from ${FOUND.length} fields, ${NEED_LOOK} need a look.`:''}`);
  setStep(5,false); render();
}
function toast(html){
  $('#toast').innerHTML = `<div class="toast">${html}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(()=>$('#toast').innerHTML='', 4200);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act],[data-tab],[data-go],[data-use],[data-say],[data-del]');
  if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  if(el.dataset.tab){ S.tab = el.dataset.tab; S.view='wizard'; const m={structure:2,existing:3,access:4}[S.tab]; if(m && S.path==='ai') setStep(m,false); render(); return; }
  if(el.dataset.go){ S.view = el.dataset.go; render(); return; }
  if(el.dataset.use){ if(el.dataset.use==='companion'){ S.cmp=true; S.useView=S.useView||'profile'; S.view='use'; render(); setTimeout(()=>{const t=$('#say'); if(t){t.value='Whose certifications expire in the next 30 days?'; t.focus();}},30); return; }
    S.useView = el.dataset.use; S.view='use'; render(); return; }
  if(el.dataset.say){ say(el.dataset.say); return; }
  if(el.dataset.del!==undefined){ S.fields.splice(+el.dataset.del,1); render(); return; }
  const a = el.dataset.act;
  if(a==='describe'){ openDescribe(); }
  else if(a==='manual'){ startManual(); }
  else if(a==='send'){ const t=$('#say'); say(t.value); }
  else if(a==='closecmp'){ S.cmp=false; renderCmp(); }
  else if(a==='opendraft'){ S.cmp=false; S.view='wizard'; S.tab='structure'; setStep(2,false); render(); }
  else if(a==='addfield'){ S.fields.push({name:'',type:'Text',req:false,rule:'',why:''}); render(); const ins=document.querySelectorAll('[data-k="name"]'); ins[ins.length-1]?.focus(); }
  else if(a==='reminder'){ S.reminder=!S.reminder; render(); }
  else if(a==='move'){ S.move=!S.move; render(); }
  else if(a==='archive'){ S.archive=!S.archive; render(); }
  else if(a==='create'){ if(S.name && S.fields.length) create(false); }
  else if(a==='remind'){ S.chat.push({html:`Done. I've queued reminders to Lena Fischer and Dana Levi. <span class="sub">(Prototype: nothing is sent.)</span>`}); renderCmp(); }
  else if(a==='noop'){ toast('Not part of this prototype.'); }
  else if(a==='bts'){ S.bts=!S.bts; render(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='oname'){ S.name = t.value; const h=$('.card .hd h2'); if(h) h.innerHTML=(S.path==='ai'?'<span class="ai spark"></span> ':'')+'New object'+(S.name?': '+esc(S.name):''); const b=$('#b-create'); if(b) b.disabled=!(S.name&&S.fields.length); }
  else if(t.id==='odesc'){ S.desc = t.value; }
  else if(t.dataset.f!==undefined && t.dataset.k!=='req'){ S.fields[+t.dataset.f][t.dataset.k] = t.value; }
  renderBts();
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='oname'){ render(); }
  if(t.dataset.f!==undefined){ const f=S.fields[+t.dataset.f]; if(t.dataset.k==='req') f.req=t.checked; else f[t.dataset.k]=t.value; renderBts(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='say' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); say(e.target.value); }
});
$('#cmpbtn').onclick = ()=>{ S.cmp=!S.cmp; renderCmp(); };

/* ============================================================
   Guide
   ============================================================ */
function setStep(n, run=true){ S.step=n; if(run) STEPS[n-1].go(); renderGuide(); }
function renderGuide(){
  const s = STEPS[S.step-1];
  $('#guide').innerHTML = `<div class="guide ${S.guideMini?'mini':''}" id="gd">
    <button class="min" data-g="min" title="Minimise">${S.guideMini?'':'–'}</button>
    <div class="k">Step ${S.step} of 5${S.guideMini?' · show guide':''}</div>
    <div class="t">${s.t}</div><div class="d">${s.d}</div>
    <div class="dots">${STEPS.map((_,i)=>`<i class="${i<S.step?'on':''}"></i>`).join('')}</div>
    <div class="nav"><button data-g="back" ${S.step===1?'style="visibility:hidden"':''}>Back</button>
      <button data-g="restart" style="font-weight:500;color:#bfb3b8">Start over</button>
      ${S.step<5?`<button class="nx" data-g="next">Next step</button>`:`<a href="../present.html?read#s9" style="color:#fff;font-weight:600;padding:6px 8px;background:var(--pink);border-radius:6px;text-decoration:none">Back to the deck</a>`}</div></div>`;
}
document.getElementById('guide').addEventListener('click', e=>{
  const g = e.target.closest('[data-g]');
  const box = e.target.closest('.guide');
  if(box && box.classList.contains('mini') && !g){ S.guideMini=false; renderGuide(); return; }
  if(!g) return;
  e.stopPropagation();
  if(g.dataset.g==='min'){ S.guideMini=true; renderGuide(); }
  if(g.dataset.g==='next'){ setStep(Math.min(5,S.step+1)); if(S.step===2 && !S.chat.some(m=>!m.me)){ /* jumped ahead: show the draft directly */ } }
  if(g.dataset.g==='back'){ setStep(Math.max(1,S.step-1)); }
  if(g.dataset.g==='restart'){ restart(); }
});
function restart(){
  Object.assign(S,{view:'objects',path:null,tab:'structure',fields:[],name:'',desc:'',reminder:true,move:true,archive:true,created:false,cmp:false,chat:[],thinking:null,useView:null,bts:false});
  setStep(1,false); render();
}

/* ============================================================
   Intro
   ============================================================ */
function intro(){
  $('#veil').innerHTML = `<div class="veil"><div class="intro">
    <div class="k">Prototype</div><h2>Custom objects in Bob</h2>
    <p>An HR systems admin at a growing company needs to track certifications. Today that means adding fields one by one, often next to fields that already exist. Here, she describes what she needs and reviews what Companion drafts.</p>
    <ol><li>Describe what you need</li><li>AI drafts it</li><li>It finds what exists</li><li>Review access and approve</li><li>Use it</li></ol>
    <div class="fine">It shows where the plan ends up (custom objects, AI setup and the reminder: phases 2 to 4 on the delivery slide), not the first release. A clickable mock-up of Bob: people, numbers and Companion's answers are made up and scripted. The step guide in the corner walks you through; you can also click around freely, or choose "Build it yourself" to try the manual path.</div>
    <button class="btn pri" data-intro="go">Start</button></div></div>`;
}
$('#veil').addEventListener('click', e=>{ if(e.target.closest('[data-intro]')){ $('#veil').innerHTML=''; const b=$('#b-describe'); if(b){ b.classList.add('pulse'); } } });

/* ============================================================
   Render
   ============================================================ */
let lastView = '';
function render(){
  const key = S.view + (S.view==='use' ? S.useView : S.view==='wizard' ? S.tab : '');
  if(key !== lastView){ window.scrollTo(0,0); lastView = key; }
  $('#where').textContent = S.view==='use' ? (S.useView==='report'?'Analytics':'People') : 'System Settings';
  $('#main').innerHTML = S.view==='objects' ? vObjects() : S.view==='wizard' ? vWizard() : vUse();
  rail(); renderCmp(); renderGuide(); renderBts();
}
render(); intro();
</script>
